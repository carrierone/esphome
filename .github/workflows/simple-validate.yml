---
name: Simple Validation

on:
  # Temporarily disabled due to GitHub billing issues
  # push:
  #   paths:
  #     - "esphome/components/m5stack_8encoder/**"
  #     - "tests/components/m5stack_8encoder/**"
  # pull_request:
  #   paths:
  #     - "esphome/components/m5stack_8encoder/**"
  #     - "tests/components/m5stack_8encoder/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Basic Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out code
        uses: actions/checkout@v5.0.0
        
      - name: List component files
        run: |
          echo "📂 Component file structure:"
          find esphome/components/m5stack_8encoder -type f | sort
          echo ""
          echo "📂 Test files:"
          find tests/components/m5stack_8encoder -type f | sort
          
      - name: Count files
        run: |
          COMPONENT_FILES=$(find esphome/components/m5stack_8encoder -name "*.py" -o -name "*.h" -o -name "*.cpp" | wc -l)
          TEST_FILES=$(find tests/components/m5stack_8encoder -name "*.yaml" | wc -l)
          
          echo "📊 Found $COMPONENT_FILES component files"
          echo "📊 Found $TEST_FILES test configuration files"
          
          if [ "$COMPONENT_FILES" -lt 10 ]; then
            echo "❌ Expected at least 10 component files"
            exit 1
          fi
          
          if [ "$TEST_FILES" -lt 8 ]; then
            echo "❌ Expected at least 8 test files"
            exit 1
          fi
          
          echo "✅ File count validation passed"

      - name: Check for required files
        run: |
          echo "📋 Checking for essential files..."
          
          REQUIRED_FILES=(
            "esphome/components/m5stack_8encoder/__init__.py"
            "esphome/components/m5stack_8encoder/m5stack_8encoder.h"
            "esphome/components/m5stack_8encoder/m5stack_8encoder.cpp"
            "esphome/components/m5stack_8encoder/README.md"
            "tests/components/m5stack_8encoder/common.yaml"
          )
          
          for file in "${REQUIRED_FILES[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ $file"
            else
              echo "❌ Missing: $file"
              exit 1
            fi
          done
          
          echo "✅ All required files present"

      - name: Basic syntax check
        run: |
          echo "🔍 Basic file validation..."
          
          # Check that Python files are not empty
          for file in $(find esphome/components/m5stack_8encoder -name "*.py"); do
            if [ ! -s "$file" ]; then
              echo "❌ Empty Python file: $file"
              exit 1
            else
              echo "✅ $file (not empty)"
            fi
          done
          
          # Check that C++ files are not empty  
          for file in $(find esphome/components/m5stack_8encoder -name "*.cpp" -o -name "*.h"); do
            if [ ! -s "$file" ]; then
              echo "❌ Empty C++ file: $file"
              exit 1
            else
              echo "✅ $file (not empty)"
            fi
          done
          
          echo "✅ Basic syntax validation passed"

      - name: Success summary
        run: |
          echo "🎉 M5Stack 8Encoder Component Validation Complete!"
          echo ""
          echo "✅ File structure validated"
          echo "✅ Required files present"
          echo "✅ Basic syntax checks passed"
          echo ""
          echo "🚀 Component is ready for testing!"