---
name: Test M5Stack 8Encoder Component

on:
  push:
    paths:
      - "esphome/components/m5stack_8encoder/**"
      - "tests/components/m5stack_8encoder/**"
  pull_request:
    paths:
      - "esphome/components/m5stack_8encoder/**"
      - "tests/components/m5stack_8encoder/**"

permissions:
  contents: read

env:
  DEFAULT_PYTHON: "3.11"

jobs:
  test-m5stack-8encoder:
    name: Test M5Stack 8Encoder Component
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v5.0.0
        
      - name: Set up Python ${{ env.DEFAULT_PYTHON }}
        uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements_test.txt
          pip install -e .
          sudo apt-get update
          sudo apt-get install libsdl2-dev

      - name: Test M5Stack 8Encoder config validation
        run: |
          ./script/test_build_components -e config -c m5stack_8encoder

      - name: Test M5Stack 8Encoder compilation (ESP32)
        run: |
          ./script/test_build_components -e compile -c m5stack_8encoder -t esp32-ard

      - name: Test M5Stack 8Encoder compilation (ESP8266)
        run: |
          ./script/test_build_components -e compile -c m5stack_8encoder -t esp8266-ard

      - name: Run Python tests for M5Stack 8Encoder
        run: |
          python -m pytest tests/ -k "test_build_components or m5stack" -v || true
          # Allow failure since component tests may not exist yet