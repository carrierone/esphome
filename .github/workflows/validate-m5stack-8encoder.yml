---
name: Validate M5Stack 8Encoder Component

on:
  push:
    paths:
      - "esphome/components/m5stack_8encoder/**"
      - "tests/components/m5stack_8encoder/**"
  pull_request:
    paths:
      - "esphome/components/m5stack_8encoder/**"
      - "tests/components/m5stack_8encoder/**"

permissions:
  contents: read

jobs:
  validate-component:
    name: Validate M5Stack 8Encoder Files
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v5.0.0
        
      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
          
      - name: Install PyYAML for validation
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML

      - name: Check component file structure
        run: |
          echo "📁 Checking component structure..."
          
          # Check main component files
          test -f esphome/components/m5stack_8encoder/__init__.py || { echo "❌ Missing main __init__.py"; exit 1; }
          test -f esphome/components/m5stack_8encoder/m5stack_8encoder.h || { echo "❌ Missing main header"; exit 1; }
          test -f esphome/components/m5stack_8encoder/m5stack_8encoder.cpp || { echo "❌ Missing main implementation"; exit 1; }
          
          # Check sensor platform
          test -f esphome/components/m5stack_8encoder/sensor/__init__.py || { echo "❌ Missing sensor __init__.py"; exit 1; }
          test -f esphome/components/m5stack_8encoder/sensor/m5stack_8encoder_sensor.h || { echo "❌ Missing sensor header"; exit 1; }
          test -f esphome/components/m5stack_8encoder/sensor/m5stack_8encoder_sensor.cpp || { echo "❌ Missing sensor implementation"; exit 1; }
          
          # Check binary sensor platform
          test -f esphome/components/m5stack_8encoder/binary_sensor/__init__.py || { echo "❌ Missing binary_sensor __init__.py"; exit 1; }
          test -f esphome/components/m5stack_8encoder/binary_sensor/m5stack_8encoder_binary_sensor.h || { echo "❌ Missing binary_sensor header"; exit 1; }
          test -f esphome/components/m5stack_8encoder/binary_sensor/m5stack_8encoder_binary_sensor.cpp || { echo "❌ Missing binary_sensor implementation"; exit 1; }
          
          # Check light platform
          test -f esphome/components/m5stack_8encoder/light/__init__.py || { echo "❌ Missing light __init__.py"; exit 1; }
          test -f esphome/components/m5stack_8encoder/light/m5stack_8encoder_light.h || { echo "❌ Missing light header"; exit 1; }
          test -f esphome/components/m5stack_8encoder/light/m5stack_8encoder_light.cpp || { echo "❌ Missing light implementation"; exit 1; }
          
          echo "✅ All required component files are present"

      - name: Check test configuration files
        run: |
          echo "📁 Checking test configurations..."
          
          test -f tests/components/m5stack_8encoder/common.yaml || { echo "❌ Missing common.yaml"; exit 1; }
          test -f tests/components/m5stack_8encoder/test.esp32-ard.yaml || { echo "❌ Missing ESP32 Arduino test"; exit 1; }
          test -f tests/components/m5stack_8encoder/test.esp8266-ard.yaml || { echo "❌ Missing ESP8266 test"; exit 1; }
          test -f tests/components/m5stack_8encoder/test.esp32-s3-ard.yaml || { echo "❌ Missing ESP32-S3 test"; exit 1; }
          
          echo "✅ All required test files are present"

      - name: Validate YAML syntax
        run: |
          echo "📋 Validating YAML syntax..."
          
          python -c "
          import yaml
          import os
          
          def validate_yaml(file_path):
              try:
                  with open(file_path, 'r') as f:
                      yaml.safe_load(f)
                  print(f'✅ {file_path}')
                  return True
              except Exception as e:
                  print(f'❌ {file_path}: {e}')
                  return False
          
          success = True
          for root, dirs, files in os.walk('tests/components/m5stack_8encoder'):
              for file in files:
                  if file.endswith('.yaml'):
                      file_path = os.path.join(root, file)
                      if not validate_yaml(file_path):
                          success = False
          
          if not success:
              exit(1)
          
          print('✅ All YAML files are valid')
          "

      - name: Check Python file syntax
        run: |
          echo "🐍 Checking Python syntax..."
          
          python -c "
          import ast
          import os
          
          def check_python_syntax(file_path):
              try:
                  with open(file_path, 'r') as f:
                      source = f.read()
                  ast.parse(source)
                  print(f'✅ {file_path}')
                  return True
              except SyntaxError as e:
                  print(f'❌ {file_path}: Syntax error at line {e.lineno}: {e.msg}')
                  return False
              except Exception as e:
                  print(f'❌ {file_path}: {e}')
                  return False
          
          success = True
          for root, dirs, files in os.walk('esphome/components/m5stack_8encoder'):
              for file in files:
                  if file.endswith('.py'):
                      file_path = os.path.join(root, file)
                      if not check_python_syntax(file_path):
                          success = False
          
          if not success:
              exit(1)
              
          print('✅ All Python files have valid syntax')
          "

      - name: Check documentation
        run: |
          echo "📖 Checking documentation..."
          
          test -f esphome/components/m5stack_8encoder/README.md || { echo "❌ Missing README.md"; exit 1; }
          
          # Check if README contains key sections
          if ! grep -q "## Configuration" esphome/components/m5stack_8encoder/README.md; then
            echo "❌ README missing Configuration section"
            exit 1
          fi
          
          if ! grep -q "## Purchase" esphome/components/m5stack_8encoder/README.md; then
            echo "❌ README missing Purchase information"
            exit 1
          fi
          
          echo "✅ Documentation is present and complete"

      - name: Validation Summary
        run: |
          echo "🎉 M5Stack 8Encoder Component Validation Complete!"
          echo "✅ File structure validated"
          echo "✅ YAML syntax validated"  
          echo "✅ Python syntax validated"
          echo "✅ Documentation validated"
          echo ""
          echo "The component is ready for use with ESPHome!"