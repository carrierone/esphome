---
name: Test M5Stack 8Encoder Component (Simple)

on:
  push:
    paths:
      - "esphome/components/m5stack_8encoder/**"
      - "tests/components/m5stack_8encoder/**"
  pull_request:
    paths:
      - "esphome/components/m5stack_8encoder/**"
      - "tests/components/m5stack_8encoder/**"

permissions:
  contents: read

env:
  DEFAULT_PYTHON: "3.11"

jobs:
  test-m5stack-8encoder:
    name: Test M5Stack 8Encoder Component
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v5.0.0
        
      - name: Set up Python ${{ env.DEFAULT_PYTHON }}
        uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          
      - name: Set up Python environment
        run: |
          python -m venv venv
          . venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements_test.txt
          pip install -e .

      - name: Validate component Python syntax
        run: |
          . venv/bin/activate
          python -m py_compile esphome/components/m5stack_8encoder/__init__.py
          python -m py_compile esphome/components/m5stack_8encoder/sensor/__init__.py  
          python -m py_compile esphome/components/m5stack_8encoder/binary_sensor/__init__.py
          python -m py_compile esphome/components/m5stack_8encoder/light/__init__.py

      - name: Test YAML configuration parsing
        run: |
          . venv/bin/activate
          python -c "
          import sys
          sys.path.insert(0, '.')
          try:
              import yaml
              with open('tests/components/m5stack_8encoder/common.yaml', 'r') as f:
                  config = yaml.safe_load(f)
              print('✅ YAML configuration parses successfully')
              print(f'Found {len(config)} top-level sections')
          except Exception as e:
              print(f'❌ YAML parsing failed: {e}')
              sys.exit(1)
          "

      - name: Check component files exist
        run: |
          echo "Checking component structure..."
          ls -la esphome/components/m5stack_8encoder/
          ls -la esphome/components/m5stack_8encoder/sensor/
          ls -la esphome/components/m5stack_8encoder/binary_sensor/  
          ls -la esphome/components/m5stack_8encoder/light/
          ls -la tests/components/m5stack_8encoder/
          echo "✅ All expected files are present"

      - name: Validate test configurations
        run: |
          . venv/bin/activate
          for config in tests/components/m5stack_8encoder/test.*.yaml; do
            echo "Validating $config..."
            python -c "
            import yaml
            with open('$config', 'r') as f:
                config = yaml.safe_load(f)
            print('✅ $config is valid YAML')
            " || echo "❌ $config has issues"
          done

      - name: Run basic import test
        run: |
          . venv/bin/activate
          python -c "
          import sys
          sys.path.insert(0, '.')
          try:
              # Test if component modules can be imported in the ESPHome context
              import esphome.config_validation as cv
              import esphome.codegen as cg
              print('✅ ESPHome core modules imported successfully')
          except Exception as e:
              print(f'❌ Import failed: {e}')
              sys.exit(1)
          "